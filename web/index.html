<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATC Iso · Theo dõi quảng cáo</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="workspace">
    <header class="topbar">
      <h1>ATC Iso</h1>
      <form id="watch-form">
        <span class="search-icon" aria-hidden="true"></span>
        <input name="input" aria-label="Thêm đối thủ: dán tên miền hoặc link nhà quảng cáo"
          placeholder="Thêm đối thủ: dán tên miền hoặc link nhà quảng cáo" required disabled>
        <button type="submit" aria-label="Thêm đối thủ" title="Thêm đối thủ" disabled>↵</button>
      </form>
      <div class="toolbar">
        <select id="profile" aria-label="Hồ sơ" disabled></select>
        <details class="profile-menu">
          <summary>Thêm hồ sơ</summary>
          <form id="profile-form">
            <label for="profile-name">Tên hồ sơ mới</label>
            <input id="profile-name" name="name" required>
            <button class="action">Thêm hồ sơ</button>
          </form>
        </details>
        <div id="status" role="status">Đang tải trạng thái…</div>
        <button id="scan" class="action" type="button">Quét ngay</button>
      </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <main>
      <aside class="watch-panel" aria-labelledby="watch-heading">
        <h2 id="watch-heading">Đối thủ</h2>
        <ul id="watches"></ul>
      </aside>
      <section class="gallery" aria-labelledby="gallery-heading">
        <h2 id="gallery-heading">Tất cả đối thủ</h2>
        <p id="gallery-summary"></p>
        <div class="filters">
          <label class="chip">Trạng thái
            <select id="filter">
              <option value="all" selected>Tất cả</option>
              <option value="new">Mới hôm nay</option>
              <option value="running">Đang chạy</option>
              <option value="stopped">Đã dừng</option>
            </select>
          </label>
          <label class="chip">Định dạng
            <select id="format">
              <option value="">Tất cả</option>
              <option value="text">Chữ</option>
              <option value="image">Hình ảnh</option>
              <option value="video">Video</option>
            </select>
          </label>
          <input id="query" type="search" aria-label="Tìm theo chữ" placeholder="Tìm theo chữ">
        </div>
        <p id="empty" role="status" hidden></p>
        <div id="ads" class="ads"></div>
      </section>
      <section class="detail-panel" aria-labelledby="detail-heading">
        <h2 id="detail-heading">Chi tiết mẫu</h2>
        <div id="detail">Chọn một mẫu quảng cáo để xem chi tiết.</div>
      </section>
    </main>
  </div>
</body>
</html>
