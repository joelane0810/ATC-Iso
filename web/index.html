<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATC Iso · Theo dõi quảng cáo</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="workspace">
    <header class="topbar">
      <h1>ATC Iso</h1>
      <form id="watch-form">
        <span class="search-icon" aria-hidden="true"></span>
        <input name="input" aria-label="Dán tên miền hoặc đường dẫn nhà quảng cáo"
          placeholder="Dán tên miền hoặc đường dẫn nhà quảng cáo" required disabled>
        <div class="watch-kinds" role="group" aria-label="Loại theo dõi">
          <button id="kind-competitor" type="button" aria-pressed="true" disabled>Đối thủ</button>
          <button id="kind-project" type="button" aria-pressed="false" disabled>Dự án</button>
        </div>
        <button type="submit" aria-label="Thêm theo dõi" title="Thêm theo dõi" disabled>↵</button>
      </form>
      <div class="toolbar">
        <select id="profile" aria-label="Hồ sơ" disabled></select>
        <details class="profile-menu">
          <summary>Thêm hồ sơ</summary>
          <form id="profile-form">
            <label for="profile-name">Tên hồ sơ mới</label>
            <input id="profile-name" name="name" required>
            <button class="action">Thêm hồ sơ</button>
          </form>
        </details>
        <div id="status" role="status">Đang tải trạng thái…</div>
        <button id="scan" class="action" type="button">Quét ngay</button>
      </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <main>
      <aside class="watch-panel" aria-label="Danh sách theo dõi">
        <button id="home" class="watch-choice" type="button" aria-pressed="true">Trang chủ</button>
        <div class="watch-group">
          <details id="group-competitor" open>
            <summary>Đối thủ</summary>
            <ul id="watches-competitor"></ul>
          </details>
          <button id="add-competitor" type="button" aria-label="Thêm đối thủ" disabled>+ Thêm</button>
        </div>
        <div class="watch-group">
          <details id="group-project" open>
            <summary>Dự án</summary>
            <ul id="watches-project"></ul>
          </details>
          <button id="add-project" type="button" aria-label="Thêm dự án" disabled>+ Thêm</button>
        </div>
      </aside>
      <section id="gallery" class="gallery" aria-labelledby="gallery-heading">
        <h2 id="gallery-heading" tabindex="-1">Tổng quan thay đổi</h2>
        <p id="gallery-summary"></p>
        <p class="search-only">Chỉ quảng cáo Google Tìm kiếm</p>
        <div id="overview">
          <div id="totals" class="totals" role="group" aria-label="Lọc theo thay đổi"></div>
          <div id="overview-watches"></div>
        </div>
        <div id="watch-view" hidden>
          <div class="filters">
            <label class="chip">Trạng thái
              <select id="filter">
                <option value="all" selected>Tất cả</option>
                <option value="new">Mới hôm nay</option>
                <option value="running">Đang chạy</option>
                <option value="stopped">Đã dừng</option>
              </select>
            </label>
            <label class="chip">Định dạng
              <select id="format">
                <option value="">Tất cả</option>
                <option value="text">Chữ</option>
                <option value="image">Hình ảnh</option>
                <option value="video">Video</option>
              </select>
            </label>
            <input id="query" type="search" aria-label="Tìm theo chữ" placeholder="Tìm theo chữ">
          </div>
          <p id="empty" role="status" hidden></p>
          <div id="ads" class="ads"></div>
        </div>
      </section>
      <section class="detail-panel" aria-labelledby="detail-heading">
        <h2 id="detail-heading">Chi tiết mẫu</h2>
        <div id="detail">Chọn một mẫu quảng cáo để xem chi tiết.</div>
      </section>
    </main>
  </div>
</body>
</html>
