<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATC Iso · Theo dõi quảng cáo</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="workspace">
    <header class="topbar">
      <h1>ATC Iso</h1>
      <form id="watch-form">
        <span class="search-icon" aria-hidden="true"></span>
        <input name="input" aria-label="Tìm nhà quảng cáo hoặc tên miền" autocomplete="off"
          placeholder="Tìm nhà quảng cáo hoặc dán đường dẫn" required disabled>
        <div class="watch-kinds" role="group" aria-label="Loại theo dõi">
          <button id="kind-competitor" type="button" aria-pressed="true" disabled>Đối thủ</button>
          <button id="kind-project" type="button" aria-pressed="false" disabled>Dự án</button>
        </div>
        <button type="submit" aria-label="Thêm theo dõi" title="Thêm theo dõi" disabled>↵</button>
        <div id="suggestions" class="suggestions" aria-label="Gợi ý theo dõi" hidden></div>
      </form>
      <div class="toolbar">
        <select id="profile" aria-label="Hồ sơ" disabled></select>
        <details class="profile-menu">
          <summary>Thêm hồ sơ</summary>
          <form id="profile-form">
            <label for="profile-name">Tên hồ sơ mới</label>
            <input id="profile-name" name="name" required>
            <button class="action">Thêm hồ sơ</button>
          </form>
        </details>
        <div id="status" role="status">Đang tải trạng thái…</div>
        <button id="scan" class="action" type="button" title="Quét ngay tất cả mục theo dõi">Quét tất cả</button>
      </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <main>
      <aside class="watch-panel" aria-label="Danh sách theo dõi">
        <button id="home" class="watch-choice" type="button" aria-pressed="true">
          <span aria-hidden="true">▦</span> Tổng quan
        </button>
        <div class="watch-group">
          <details id="group-competitor" open>
            <summary>Đối thủ</summary>
            <ul id="watches-competitor"></ul>
          </details>
          <button id="add-competitor" type="button" aria-label="Thêm đối thủ" disabled>+ Thêm</button>
        </div>
        <div class="watch-group">
          <details id="group-project" open>
            <summary>Dự án</summary>
            <ul id="watches-project"></ul>
          </details>
          <button id="add-project" type="button" aria-label="Thêm dự án" disabled>+ Thêm</button>
        </div>
      </aside>
      <section id="gallery" class="gallery" aria-labelledby="gallery-heading">
        <h2 id="gallery-heading" tabindex="-1">Tổng quan thay đổi</h2>
        <p id="gallery-summary"></p>
        <p class="search-only">Chỉ quảng cáo Google Tìm kiếm</p>
        <div class="range-toolbar">
          <button id="range-open" class="chip range-chip" type="button" aria-haspopup="dialog"
            aria-controls="range-dialog" disabled>
            <span>Phạm vi ngày</span><strong id="range-value">Mọi lúc</strong><span aria-hidden="true">▾</span>
          </button>
          <span id="comparison"></span>
        </div>
        <dialog id="range-dialog" aria-label="Phạm vi ngày">
          <form id="range-form">
            <div class="range-inputs">
              <label>Ngày bắt đầu*<input id="range-from" placeholder="31 thg 5, 2018" autocomplete="off" required></label>
              <label>Ngày kết thúc*<input id="range-to" placeholder="31 thg 5, 2018" autocomplete="off" required></label>
            </div>
            <p id="range-error" role="status" hidden></p>
            <div class="calendar-nav">
              <label class="calendar-month-choice">
                <span id="calendar-title" aria-hidden="true"></span><span aria-hidden="true">▾</span>
                <select id="calendar-jump" aria-label="Chuyển đến tháng"></select>
              </label>
              <button id="calendar-prev" type="button" aria-label="Tháng trước">‹</button>
              <button id="calendar-next" type="button" aria-label="Tháng sau">›</button>
            </div>
            <div id="calendar-weekdays" class="calendar-grid" aria-hidden="true">
              <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
            </div>
            <div id="calendar-months" tabindex="0" aria-label="Lịch theo tháng"></div>
            <button id="range-reset" type="button">Đặt lại: Mọi lúc</button>
            <footer class="range-footer">
              <span>Dữ liệu theo giờ Việt Nam</span>
              <button id="range-cancel" type="button">Hủy</button>
              <button class="action" type="submit">OK</button>
            </footer>
          </form>
        </dialog>
        <div id="overview">
          <div id="totals" class="totals" role="group" aria-label="Lọc theo thay đổi"></div>
          <div id="overview-watches"></div>
        </div>
        <div id="watch-view" hidden>
          <div class="watch-tools">
            <div role="group" aria-label="Cách xem">
              <button id="mode-groups" type="button" aria-pressed="true">Theo nhà QC/dự án</button>
              <button id="mode-grid" type="button" aria-pressed="false">Lưới mẫu</button>
            </div>
            <button id="scan-watch" class="action" type="button">Quét mục này</button>
          </div>
          <div id="watch-chart"></div>
          <div id="group-view">
            <label class="chip">Sắp xếp theo
              <select id="group-sort">
                <option value="runningNow">Đang chạy</option>
                <option value="newAds">Ads mới</option>
                <option value="delta">Thay đổi</option>
                <option value="name">Tên</option>
              </select>
            </label>
            <div id="watch-groups"></div>
          </div>
          <div id="grid-view" hidden>
            <div class="filters">
              <label class="chip">Trạng thái
                <select id="filter">
                  <option value="all" selected>Tất cả</option>
                  <option value="new">Mới hôm nay</option>
                  <option value="running">Đang chạy</option>
                  <option value="stopped">Đã dừng</option>
                </select>
              </label>
              <label class="chip">Định dạng
                <select id="format">
                  <option value="">Tất cả</option>
                  <option value="text">Chữ</option>
                  <option value="image">Hình ảnh</option>
                  <option value="video">Video</option>
                </select>
              </label>
              <input id="query" type="search" aria-label="Tìm theo chữ" placeholder="Tìm theo chữ">
            </div>
            <p id="empty" role="status" hidden></p>
            <div id="ads" class="ads"></div>
          </div>
        </div>
      </section>
      <section class="detail-panel" aria-labelledby="detail-heading">
        <h2 id="detail-heading">Chi tiết mẫu</h2>
        <div id="detail">Chọn một mẫu quảng cáo để xem chi tiết.</div>
      </section>
    </main>
  </div>
</body>
</html>
